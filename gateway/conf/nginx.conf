
#user  nobody;

worker_processes auto;
error_log  logs/error.log warn;
error_log logs/error.log error;    # Erreurs et plus graves
error_log logs/infos.log info;     # Infos et plus graves
error_log logs/notice.log notice;  # Notices et plus graves
error_log logs/alerts.log alert;   # Alerts et plus graves
error_log logs/debugs.log debug;   # Debug complet

pid        logs/nginx.pid;


events {
    worker_connections  1024;
    multi_accept on;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    log_format debug '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" '
                     'urt="$upstream_response_time"';

    access_log  logs/access.log  main;
    access_log  logs/debug.log  debug;

    lua_package_path "lua/?.lua; /lualib/?.lua;;";

    # Optimisations
    sendfile        on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Cache
    proxy_cache_path cache-gtu levels=1:2 keys_zone=my_cache:10m inactive=60m;
    
    # GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;


    # Définir les upstreams pour vos services (adaptez hosts/ports)

    upstream auth_bibacad {
        # server 192.168.8.103:8001;
        server auth-bibacad:3003;
        # server localhost:8001;
        keepalive 32;
    }
    upstream docs_bibacad {
        # server 192.168.8.103:8002;
        server docs-bibacad:8002;
        keepalive 32;
    }
    upstream frontend_manger_bibacad {
        server dashboard-bibacad:3002;
        keepalive 32;
    }
    upstream frontend_bibacad {
        server dashboard-bibacad:3002;
        keepalive 32;
    }

    


    server {
        listen       80;
        server_name  bibacad-cm.com localhost ~.*\.ngrok\.io$;
        set $upstream '';
        # Variables Lua
        set $uptime "";
        access_log  logs/access.log  main;
        
        # Health check JSON (API)
        location = /health {
           add_header Content-Type application/json;
            return 200 '{"status": "healthy", "service": "openresty", "timestamp": "$time_iso8601"}';
        }
        
        # Health check simple (texte)
        location = /health/simple {
            add_header Content-Type text/plain;
            return 200 "OpenResty is running";
        }
        
        
        # ==========================================
        # ROUTES PRINCIPALES
        # ==========================================
        location = /test {
            add_header Content-Type text/plain;
            return 200 'TEST WORKS';
        }

        # ======================
        # API ROUTES (spécifiques d'abord)
        # ======================
        
        location ~ ^/auth(.*)$ {
            access_log logs/auth.log debug;
            proxy_pass http://auth_bibacad/api$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location ~ ^/candidatures(.*)$ {
            proxy_pass http://docs_bibacad/api/candidatures$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ======================
        # FILES - Static files from Laravel public folder
        # ======================
        location ~ ^/storage/(.*)$ {
            # Serve static files from Laravel's public storage directory
            proxy_pass http://docs_bibacad/storage/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Cache static files
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Generic uploads fallback (if needed)
        location ~ ^/uploads(.*)$ {
            proxy_pass http://docs_bibacad/storage/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # ======================
        # STATIC FILES - doit être avant location /
        # ======================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|map)$ {
            proxy_pass http://frontend_bibacad;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache pour les fichiers statiques
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }


        # EN DERNIER : Bloc générique pour frontend
        location /app {
            proxy_pass http://frontend_bibacad;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pour WebSockets/Socket.io si besoin
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering désactivé pour HMR
            proxy_buffering off;
        }

        location = / {
            return 301 /app/;
        }

        # ==========================================
        # ERROR PAGES
        # ==========================================
        error_page 404 /404.html;
        
        location = /404.html {
            internal;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }


}
